name: hamtayar-staging

services:
  staging:
    image: neo4j:5.26.32-community
    ports:
      - "127.0.0.1:7476:7474"
      - "127.0.0.1:7689:7687"
    environment:
      NEO4J_AUTH: "neo4j/${STAGING_NEO4J_PASSWORD:?Set STAGING_NEO4J_PASSWORD in .env}"
      NEO4J_server_memory_heap_initial__size: "2G"
      NEO4J_server_memory_heap_max__size: "6G"
      NEO4J_server_memory_pagecache_size: "1G"
      NEO4J_dbms_memory_transaction_total_max: "4G"
    volumes:
      - staging_data:/data
    restart: unless-stopped

volumes:
  staging_data: